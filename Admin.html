<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ARMAN ADMIN</title>
<style>body{background:#0a0a0a;color:#fff;text-align:center;font-family:sans-serif;padding:20px}input{padding:12px;width:90%;max-width:300px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{background:#ff0055;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px} .box{background:#111;border:1px solid #222;padding:15px;border-radius:12px;max-width:500px;margin:15px auto;text-align:left} .del{background:red;padding:6px 12px;font-size:13px} .active{color:#00ff88} .expired{color:red}</style></head>
<body>

<div id="loginBox">
<h1>ARMAN <span style="color:#ff0055">ADMIN</span></h1>
<p>Only Owner Can Login</p>
<input type="password" id="pass" placeholder="Enter Admin Password"><br>
<button onclick="login()">LOGIN</button>
<p id="msg" style="color:red"></p>
</div>

<div id="adminBox" style="display:none">
<h1>🔑 ALL KEYS</h1>
<input type="text" id="search" placeholder="Search Key..." onkeyup="filterKeys()"><br>
<button onclick="loadKeys()">🔄 REFRESH</button>
<p id="total"></p>
<div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyA8-LW7UM4wovgLmuKSrAZxiFp3qHs44dA",
  authDomain: "arman-key-system.firebaseapp.com",
  databaseURL: "https://arman-key-system-default-rtdb.firebaseio.com",
  projectId: "arman-key-system",
  storageBucket: "arman-key-system.firebasestorage.app",
  messagingSenderId: "179603043525",
  appId: "1:179603043525:web:d1bcba0e96365c8ed9acac",
  measurementId: "G-5V0RD25QXE"
};
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
let allKeys = {};

window.login = function(){
  let p = document.getElementById("pass").value;
  if(p === "Ayushi@2010"){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminBox").style.display = "block";
    loadKeys();
  } else {
    document.getElementById("msg").innerText = "Wrong Password!";
  }
}

window.loadKeys = function(){
  onValue(ref(db,'keys'), (snap)=>{
    let data = snap.val() || {};
    allKeys = data;
    showKeys(data);
  });
}

function showKeys(data){
  let list = document.getElementById("list");
  list.innerHTML = "";
  let keys = Object.keys(data);
  document.getElementById("total").innerText = "Total Keys: " + keys.length;
  keys.reverse().forEach(k=>{
    let v = data[k];
    let exp = new Date(v.expiry).toLocaleString();
    let status = Date.now() > v.expiry ? '<span class="expired">EXPIRED</span>' : '<span class="active">ACTIVE</span>';
    let div = document.createElement("div");
    div.className = "box";
    div.innerHTML = "<b>"+k+"</b><br>Status: "+status+"<br>Expiry: "+exp+"<br>HWID: "+(v.hwid||"Not Used Yet")+"<br><br><button class='del' onclick=\"deleteKey('"+k+"')\">DELETE / BAN</button>";
    div.setAttribute("data-key", k.toLowerCase());
    list.appendChild(div);
  });
}

window.filterKeys = function(){
  let q = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll("#list .box").forEach(el=>{
    el.style.display = el.getAttribute("data-key").includes(q) ? "block" : "none";
  });
}

window.deleteKey = async function(k){
  if(confirm("Is Key ko BAN kar du? "+k)){
    await remove(ref(db,'keys/'+k));
    alert("Key Deleted / Banned!");
  }
}
</script></body></html>
