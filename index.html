<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARMAN CORE — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#05060a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;font-family:'Inter',sans-serif}
body::before{content:'';position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover;opacity:.55}
body::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.7))}
.badge{position:relative;z-index:2;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:11px 20px;border-radius:100px;font-size:11px;letter-spacing:2.5px;text-align:center;line-height:1.7;margin-bottom:80px;font-family:'Montserrat',sans-serif;font-weight:500}
.badge span{color:#2ecc71;font-size:14px;margin-right:6px}
.card{position:relative;z-index:2;width:100%;max-width:380px;background:rgba(10,18,20,.65);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:28px 24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.avatar{width:88px;height:88px;border-radius:50%;margin:-72px auto 14px;overflow:hidden;border:3px solid #00f5d4}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;letter-spacing:8px;font-size:36px;line-height:1}
p.sub{font-family:'Montserrat',sans-serif;letter-spacing:5px;font-size:10.5px;color:#8b9a9e;margin:10px 0 26px;font-weight:500}
label{display:block;text-align:left;font-size:15px;font-weight:700;margin-bottom:10px;font-family:'Inter',sans-serif}
.input-box{display:flex;align-items:center;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:0 14px;margin-bottom:16px}
.input-box input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:15px 10px;font-size:15px;font-family:'Inter',sans-serif}
.input-box input::placeholder{color:#7a8a8e}
.eye{cursor:pointer;opacity:.7}
button{width:100%;padding:16px;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;font-weight:600;font-size:16px;cursor:pointer;font-family:'Inter',sans-serif}
.dev{margin-top:18px;font-size:11px;letter-spacing:3px;color:#8b9a9e;font-family:'Montserrat',sans-serif;font-weight:500}
.msg{font-size:13px;color:#ff6b6b;margin-top:10px;min-height:16px}
#dashboard{display:none;position:relative;z-index:2;width:100%;max-width:900px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.badge{margin-bottom:50px}}
.stat{background:rgba(13,16,23,.9);border:1px solid #1f2433;border-radius:16px;padding:16px}
.stat small{color:#8b93a7}.stat b{font-size:26px;display:block;margin-top:5px}
.panel{background:rgba(13,16,23,.9);border:1px solid #1f2433;border-radius:16px;padding:16px;margin-top:12px}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #1a1e2b;font-size:14px}
.badge2{background:#123322;color:#2ecc71;padding:4px 10px;border-radius:20px;font-size:11px}
</style>
</head>
<body>
<div class="badge"><span>●</span> ARMAN MASTER CLEARANCE •<br>256-BIT ENCRYPTED</div>
<div class="card" id="loginCard">
<div class="avatar"><img src="logo.jpg" alt="ARMAN"></div>
<h1>ARMAN CORE</h1>
<p class="sub">GLOBAL MASTER CONTROL</p>
<label>Master Password</label>
<div class="input-box">🛡<input type="password" id="pass" placeholder="Enter Master Admin Key"><span class="eye" onclick="toggle()">👁</span></div>
<button onclick="login()">Unlock Admin &nbsp;→</button>
<div class="msg" id="msg"></div>
<div class="dev">DEVELOPER</div>
</div>
<div id="dashboard">
<div class="top"><h2>Welcome, <span style="color:#ff9500">ARMAN</span> 👑</h2><button onclick="logout()" style="width:auto;padding:9px 16px;background:#1a1e2b;border:1px solid #2a2f42;color:#fff;border-radius:10px">Logout</button></div>
<div class="grid"><div class="stat"><small>Total Resellers</small><b>12</b></div><div class="stat"><small>Total Licenses</small><b>148</b></div><div class="stat"><small>Active Users</small><b>89</b></div></div>
<div class="panel"><h3 style="margin-bottom:6px">Recent Resellers</h3><div class="row"><span>reseller_01 • 20 Keys</span><span class="badge2">ACTIVE</span></div><div class="row"><span>tiger_mods • 15 Keys</span><span class="badge2">ACTIVE</span></div><div class="row"><span>arman_vip • 50 Keys</span><span class="badge2">ACTIVE</span></div></div>
</div>
<script>
const ADMIN_PASS="Ayushi@2010";
function login(){const v=document.getElementById('pass').value;if(v===ADMIN_PASS){document.getElementById('loginCard').style.display='none';document.querySelector('.badge').style.display='none';document.getElementById('dashboard').style.display='block';}else{document.getElementById('msg').innerText="Wrong Password! Access Denied.";}}
function logout(){document.getElementById('dashboard').style.display='none';document.getElementById('loginCard').style.display='block';document.querySelector('.badge').style.display='block';document.getElementById('pass').value='';}
function toggle(){const p=document.getElementById('pass');p.type=p.type==='password'?'text':'password';}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
